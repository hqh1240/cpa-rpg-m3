<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#6d4327">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/pwa/pwa-icon-192.png">
  <link rel="apple-touch-icon" href="assets/pwa/pwa-icon-192.png">
  <title>注会纪元 · CPA RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-sunnyside="pending">
  <div id="app">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <div id="hud" class="hidden">
      <div class="panel hud-card">
        <div class="avatar" aria-label="主角"></div>
        <div class="hero-info">
          <div class="hero-name">簿记剑士</div>
          <div class="hero-sub">金算原野 · 分录镇</div>
        </div>
        <div class="bars">
          <div class="bar-row"><div class="bar-wrap hp"><div class="bar-fill" id="hpBar"></div></div><span id="hpText">100/100</span></div>
          <div class="bar-row"><div class="bar-wrap mp"><div class="bar-fill" id="mpBar"></div></div><span id="mpText">60/60</span></div>
        </div>
        <div class="gold" id="goldText">0 G</div>
      </div>
      <div class="panel quest-card">
        <div class="quest-title">主线</div>
        <div class="quest-text" id="questText">前往天平衡碑，调查借贷失衡</div>
      </div>
      <div class="panel minimap" id="minimap"></div>
      <div class="panel map-buttons">
        <button class="pixel-btn small" data-action="menu"><span class="ui-icon"><img src="assets/sunnyside/ui/cursor_01.png" alt=""></span><span>菜单</span></button>
        <button class="pixel-btn small secondary" data-action="tasks"><span class="ui-icon"><img src="assets/sunnyside/ui/confirm.png" alt=""></span><span>任务</span></button>
        <button class="pixel-btn small" data-action="book"><span class="ui-icon"><img src="assets/sunnyside/ui/axe.png" alt=""></span><span>错题本</span></button>
        <button class="pixel-btn small" data-action="report"><span class="ui-icon"><img src="assets/sunnyside/ui/hammer.png" alt=""></span><span>学习报告</span></button>
      </div>
      <div class="panel control-hint">
        <span class="key-icon"><img src="assets/ui/keys/Keyboard_W.png" alt="W"></span>
        <span class="key-icon"><img src="assets/ui/keys/Keyboard_A.png" alt="A"></span>
        <span class="key-icon"><img src="assets/ui/keys/Keyboard_S.png" alt="S"></span>
        <span class="key-icon"><img src="assets/ui/keys/Keyboard_D.png" alt="D"></span>
        移动 ·
        <span class="key-icon"><img src="assets/ui/keys/Keyboard_E.png" alt="E"></span>
        交互
      </div>
    </div>

    <div id="modal" class="hidden"></div>

    <div id="touchControls" class="hidden">
      <div id="dpad">
        <button data-touch="up" aria-label="上">▲</button>
        <button data-touch="left" aria-label="左">◀</button>
        <button data-touch="down" aria-label="下">▼</button>
        <button data-touch="right" aria-label="右">▶</button>
      </div>
      <button id="touchInteract" class="pixel-btn">交互</button>
    </div>

    <div id="fadePanel"></div>
    <div id="loadingPanel">
      <div class="loading-box">
        <div class="loading-title">正在载入记账大陆</div>
        <div class="loading-track"><div id="loadingBar"></div></div>
        <div id="loadingHint" class="loading-hint">0%</div>
      </div>
    </div>
    <div id="toast" class="hidden"></div>
    <div id="tooltip" class="hidden"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
